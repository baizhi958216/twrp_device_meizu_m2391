name: Build OrangeFox
run-name: OrangeFox m2391 · ${{ github.ref_name }} · run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel build jobs
        type: choice
        default: '4'
        options:
          - '4'
          - '2'

permissions:
  contents: read

concurrency:
  group: orangefox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      JOBS: ${{ inputs.jobs }}
      SOURCE_DIR: ${{ github.workspace }}/orangefox
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - name: Check out device tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: device-tree
          persist-credentials: false

      - name: Prepare runner storage and dependencies
        run: |
          mkdir -p "$ARTIFACT_DIR/logs" "$SOURCE_DIR"
          df -h | tee "$ARTIFACT_DIR/logs/disk-before.txt"
          # This disposable runner does not need its Android SDK or other SDKs.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache \
            /usr/share/swift
          sudo docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex fontconfig \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32z1-dev libc6-dev-i386 libelf-dev \
            libgl1-mesa-dev libncurses5 libncurses5-dev libssl-dev \
            libxml2-utils lzop openssl pngcrush python3 python-is-python3 \
            rsync schedtool squashfs-tools unzip x11proto-core-dev xsltproc \
            zip zlib1g-dev
          sudo apt-get clean
          sudo fallocate -l 8G /swapfile-twrp
          sudo chmod 600 /swapfile-twrp
          sudo mkswap /swapfile-twrp
          sudo swapon /swapfile-twrp
          df -h | tee "$ARTIFACT_DIR/logs/disk-prepared.txt"
          free -h | tee "$ARTIFACT_DIR/logs/memory.txt"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$RUNNER_TEMP/repo"
          chmod 755 "$RUNNER_TEMP/repo"
          git config --global user.name 'OrangeFox Builder'
          git config --global user.email 'twrp-builder@users.noreply.github.com'

      - name: Sync OrangeFox fox_12.1
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$RUNNER_TEMP/OrangeFox-sync"
          cd "$RUNNER_TEMP/OrangeFox-sync"
          # Compatibility with sync revisions that reference this one level up.
          if [ -f patches/patch-vendor-twrp-fox_12.1.diff ]; then
            ln -sf patches/patch-vendor-twrp-fox_12.1.diff patch-vendor-twrp-fox_12.1.diff
          fi
          export PATH="$RUNNER_TEMP:$PATH"
          bash orangefox_sync.sh --branch 12.1 --path "$SOURCE_DIR" \
            2>&1 | tee "$ARTIFACT_DIR/logs/orangefox-sync.log"
          cd "$SOURCE_DIR"
          repo manifest -r -o "$ARTIFACT_DIR/source-manifest.xml"
          mkdir -p device/meizu/m2391
          rsync -a --exclude=.git --exclude=.github \
            "$GITHUB_WORKSPACE/device-tree/" device/meizu/m2391/
          git -C "$GITHUB_WORKSPACE/device-tree" rev-parse HEAD \
            > "$ARTIFACT_DIR/device-tree-commit.txt"
          df -h | tee "$ARTIFACT_DIR/logs/disk-after-sync.txt"

      - name: Build recoveryimage
        run: |
          cd "$SOURCE_DIR"
          bash device/meizu/m2391/build.sh 2>&1 | tee "$ARTIFACT_DIR/logs/build.log"

      - name: Collect recovery image
        run: |
          cd "$SOURCE_DIR"
          cp out/target/product/m2391/recovery.img "$ARTIFACT_DIR/recovery.img"
          cp out/target/product/m2391/OrangeFox-*.zip "$ARTIFACT_DIR/"
          cd "$ARTIFACT_DIR"
          sha256sum recovery.img OrangeFox-*.zip > SHA256SUMS
          {
            echo '### OrangeFox m2391 build'
            echo
            echo "Device tree: $GITHUB_SHA"
            echo
            echo '```text'
            cat SHA256SUMS
            echo '```'
            echo
            echo 'Download the recovery artifact below. Build success does not verify device runtime behavior.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orangefox-m2391-${{ github.run_number }}
          path: |
            artifacts/recovery.img
            artifacts/OrangeFox-*.zip
            artifacts/SHA256SUMS
            artifacts/source-manifest.xml
            artifacts/device-tree-commit.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orangefox-m2391-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/logs/
            artifacts/source-manifest.xml
            artifacts/device-tree-commit.txt
          if-no-files-found: warn
          retention-days: 14
